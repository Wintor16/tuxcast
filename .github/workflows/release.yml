name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-pipewire \
            tesseract-ocr

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "TuxCast ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Strip bundled GStreamer from the AppImage
        if: matrix.platform == 'ubuntu-latest'
        run: |
          set -e
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -1)
          ABS_APPIMAGE=$(readlink -f "$APPIMAGE")
          echo "Repackaging $ABS_APPIMAGE"
          WORKDIR=$(mktemp -d)
          pushd "$WORKDIR"
          "$ABS_APPIMAGE" --appimage-extract >/dev/null
          # linuxdeploy pulls its own private GStreamer core (pinned to whatever
          # webkit2gtk depended on at build time, e.g. 1.23.90) into the AppDir.
          # It bundles no plugins alongside it, so at runtime we point
          # GST_PLUGIN_SYSTEM_PATH at the host's real GStreamer plugins (see
          # ensure_gst_plugin_path in portal.rs) - but those plugins are built
          # against the host's much newer GStreamer core, so loading e.g.
          # pipewiresrc against the bundled 1.23.90 core fails with an
          # undefined-symbol error. Deleting the bundled core/helper libs makes
          # both our binary and webkit2gtk fall back to the host's GStreamer
          # install, which is consistent with the host's own plugins.
          rm -f squashfs-root/usr/lib/libgst*.so*
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool squashfs-root "$ABS_APPIMAGE"
          popd
          rm -rf "$WORKDIR"

      - name: Re-upload fixed AppImage
        if: matrix.platform == 'ubuntu-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -1)
          gh release upload ${{ github.ref_name }} "$APPIMAGE" --clobber --repo ${{ github.repository }}
